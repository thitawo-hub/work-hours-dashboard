<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Driver Rest Hours</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g9:#0f3d24;--g8:#14532d;--g7:#166534;--g1:#e8f0eb;--bg:#f4f6f5;--ink:#14231a;--mut:#5f6f66;--line:#dfe6e2;--red:#b91c1c;--ok:#15803d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Sarabun,"Noto Sans Thai",Tahoma,Arial,sans-serif;color:var(--ink);font-size:14px}
header{background:linear-gradient(135deg,var(--g9),var(--g7));color:#fff;padding:16px 28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(15,61,36,.25)}
header h1{margin:0;font-size:21px;font-weight:700;flex:1;letter-spacing:.2px}
header h1 small{display:block;font-size:12px;font-weight:400;opacity:.75;margin-top:2px}
.tabs{flex-basis:100%;display:flex;gap:6px;margin:-4px 0 2px}
.tabs a{color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.12)}
.tabs a.on{background:#fff;color:var(--g8)}.tabs a:hover:not(.on){background:rgba(255,255,255,.25)}
input,select,button{font:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
button{background:#fff;color:var(--g8);border:0;font-weight:700;cursor:pointer}button:hover{background:var(--g1)}button:disabled{opacity:.5;cursor:wait}
.page{max-width:1440px;margin:auto;padding:22px 24px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.k{background:#fff;border:1px solid var(--line);border-left:4px solid var(--g7);border-radius:10px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,61,36,.06)}
.k small{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.k b{display:block;font-size:26px;margin-top:8px;color:var(--g8);font-variant-numeric:tabular-nums}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:18px;box-shadow:0 1px 2px rgba(15,61,36,.06)}
.box h2{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--g8);padding-bottom:10px;border-bottom:2px solid var(--g1)}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:750px}
th,td{padding:9px 12px;border-bottom:1px solid #edf1ef;text-align:left}
th{background:var(--g1);color:var(--g8);font-weight:700;font-size:12px;position:sticky;top:0;z-index:1}
tbody tr:nth-child(even) td{background:#fafcfb}tr:hover td{background:#f0f6f2!important}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--red);font-weight:700}
.warn{background:#fff;color:var(--mut);border:1px solid var(--line);border-left:4px solid var(--g7);padding:9px 14px;border-radius:8px;font-size:12.5px;margin-bottom:16px;line-height:1.8;overflow-wrap:anywhere}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.page{padding:14px}header{padding:14px}.controls>*{width:100%}}
</style></head><body>
<header><nav class="tabs"><a href="index.html">ภาพรวม</a><a class="on" href="rest-hours.html">เวลาพัก พขร.</a></nav>
<h1>Driver Rest Hours<small>ตรวจสอบเวลาพักระหว่างงาน — ต้องพักอย่างน้อย 10 ชั่วโมง</small></h1>
<button id="reload" type="button">รีเฟรชข้อมูล</button></header>
<div class="page">
<div id="message" class="warn" role="status">กำลังโหลดข้อมูลจาก Google Sheets...</div>
<div class="cards">
<div class="k"><small>พขร.ทั้งหมด</small><b id="drivers">0</b></div>
<div class="k"><small>รอบพักผ่าน (≥10 ชม.)</small><b id="passed">0</b></div>
<div class="k"><small>รอบพักไม่ผ่าน (&lt;10 ชม.)</small><b id="failed">0</b></div>
<div class="k"><small>อัตราผ่าน</small><b id="rate">0%</b></div>
</div>
<div class="box"><h2>รอบพักระหว่างงาน</h2>
<div class="controls"><input id="search" placeholder="ค้นหาชื่อ พขร.">
<select id="status"><option value="all">ทุกสถานะ</option><option value="ผ่าน">ผ่าน</option><option value="ไม่ผ่าน">ไม่ผ่าน</option></select>
<select id="branch"><option value="all">ทุกสาขา</option></select></div>
<div class="wrap"><table><thead><tr><th>พขร.</th><th>สาขา</th><th>จบงานก่อนหน้า</th><th>เริ่มงานถัดไป</th><th>เวลาพัก</th><th>สถานะ</th></tr></thead>
<tbody id="rows"><tr><td colspan="6">กำลังโหลดข้อมูล...</td></tr></tbody></table></div></div>
</div>
<script>
"use strict";
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSWLQuTDK81qBHrVGIrbfLMQd2SbGcmeVPqgnd5RNzIKEYFYgenm6kofz8bzaLI-wmSnY6oZE8759Vy/pub?output=csv";
const HEADERS={driver:["ชื่อ พขร","ชื่อพขร","พขร","ชื่อพนักงานขับรถ"],date:["Date","วันที่"],branch:["สาขา","Branch"],
selectedStart:["เวลาเริ่มที่เลือก"],selectedEnd:["เวลาจบที่เลือก"],ghStart:["เริ่มงาน GH"],ghEnd:["จบงาน GH"],swStart:["เริ่มงาน SW"],swEnd:["จบงาน SW"],
famulaStart:["เริ่ม Famula","เริ่มงาน Famula"],famulaEnd:["จบ Famula","จบงาน Famula"]};
const REST_LIMIT_MS=10*3600*1000;
let records=[],restRows=[],loading=false;
function parseCSV(text){const rows=[];let row=[],cell="",quoted=false;text=text.replace(/^\uFEFF/,"");
for(let i=0;i<text.length;i++){const c=text[i],next=text[i+1];
if(c==='"'&&quoted&&next==='"'){cell+='"';i++}else if(c==='"')quoted=!quoted;
else if(c===","&&!quoted){row.push(cell.trim());cell=""}
else if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&next==="\n")i++;row.push(cell.trim());if(row.some(v=>v!==""))rows.push(row);row=[];cell=""}
else cell+=c}
if(cell.length||row.length){row.push(cell.trim());if(row.some(v=>v!==""))rows.push(row)}return rows}
const normalizeHeader=v=>String(v||"").replace(/^\uFEFF/,"").replace(/\s+/g," ").trim().toLowerCase();
function getColumnMap(h){const m=new Map();h.forEach((x,i)=>{const k=normalizeHeader(x);if(k&&!m.has(k))m.set(k,i)});return m}
function getValue(row,cm,aliases){for(const a of aliases){const i=cm.get(normalizeHeader(a));if(i!==undefined){const v=String(row[i]??"").trim();if(v!=="")return v}}return ""}
function makeDate(y,mo,d,h=0,mi=0,s=0){if(y>2400)y-=543;
if(y<1900||mo<1||mo>12||d<1||d>31||h<0||h>23||mi<0||mi>59||s<0||s>59)return null;
const dt=new Date(y,mo-1,d,h,mi,s);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;return dt}
function parseDate(value){if(value==null||String(value).trim()==="")return null;const s=String(value).trim();
let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
if(m)return makeDate(+m[3],+m[2],+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0));
m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
if(m)return makeDate(+m[1],+m[2],+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
if(/^\d+(\.\d+)?$/.test(s)){const n=Number(s);if(n>=20000&&n<=100000){const d=new Date(new Date(1899,11,30).getTime()+Math.round(n*86400000));return isNaN(d.getTime())?null:d}}
const d=new Date(s);return isNaN(d.getTime())?null:d}
function parseTime(value){if(value==null||String(value).trim()==="")return null;const s=String(value).trim();
if(/^\d*\.?\d+$/.test(s)){const n=Number(s);if(n>=0&&n<1){const t=Math.round(n*86400);return{hour:Math.floor(t/3600)%24,minute:Math.floor(t/60)%60,second:t%60}}}
const m=s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i);if(!m)return null;
let hour=+m[1];const minute=+m[2],second=+(m[3]||0),ap=(m[4]||"").toUpperCase();
if(minute>59||second>59||hour>23)return null;
if(ap){if(hour<1||hour>12)return null;if(ap==="AM"&&hour===12)hour=0;if(ap==="PM"&&hour!==12)hour+=12}
return{hour,minute,second}}
function combineDateTime(dateValue,timeValue){if(!timeValue)return null;const full=parseDate(timeValue);if(full)return full;
const t=parseTime(timeValue),d=parseDate(dateValue);if(!t||!d)return null;
return new Date(d.getFullYear(),d.getMonth(),d.getDate(),t.hour,t.minute,t.second)}
function buildRecords(row,cols,rowNumber,stats){
const driver=getValue(row,cols,HEADERS.driver),branch=getValue(row,cols,HEADERS.branch),dateRaw=getValue(row,cols,HEADERS.date);
if(!driver){stats.missingDriver++;return[]}
const ss=getValue(row,cols,HEADERS.selectedStart),se=getValue(row,cols,HEADERS.selectedEnd),pairs=[];
if(ss&&se)pairs.push({label:"เวลาที่เลือก",startRaw:ss,endRaw:se});
else{[{label:"GH",startRaw:getValue(row,cols,HEADERS.ghStart),endRaw:getValue(row,cols,HEADERS.ghEnd)},
{label:"SW",startRaw:getValue(row,cols,HEADERS.swStart),endRaw:getValue(row,cols,HEADERS.swEnd)},
{label:"Famula",startRaw:getValue(row,cols,HEADERS.famulaStart),endRaw:getValue(row,cols,HEADERS.famulaEnd)}]
.forEach(p=>{if(p.startRaw&&p.endRaw)pairs.push(p);else if(p.startRaw||p.endRaw)stats.incompletePairs++})}
if(!pairs.length){stats.missingTimes++;return[]}
const result=[];
pairs.forEach(p=>{const start=combineDateTime(dateRaw,p.startRaw);let end=combineDateTime(dateRaw,p.endRaw);
if(!start||!end){stats.invalidDates++;return}
if(end<start&&p.endRaw.indexOf("/")===-1&&!/^\d{4}-\d{1,2}-\d{1,2}/.test(p.endRaw)){if(start.getTime()-end.getTime()<=86400000)end=new Date(end.getTime()+86400000)}
if(end<start){stats.invalidDates++;return}
result.push({driver,branch,start,end,source:p.label,rowNumber})});
return result}
async function loadData(){if(loading)return;loading=true;
const message=document.getElementById("message"),reload=document.getElementById("reload");
reload.disabled=true;message.textContent="กำลังโหลดข้อมูลจาก Google Sheets...";
try{const sep=CSV_URL.includes("?")?"&":"?";
const response=await fetch(CSV_URL+sep+"_="+Date.now(),{cache:"no-store"});
if(!response.ok)throw new Error("HTTP "+response.status);
const csvText=await response.text();
if(/<html[\s>]/i.test(csvText.slice(0,1000))||/google sign in/i.test(csvText.slice(0,3000)))throw new Error("ไม่ได้รับ CSV กรุณาตรวจสอบการเผยแพร่ Google Sheets");
const data=parseCSV(csvText);if(data.length<2)throw new Error("ไม่พบข้อมูลใน CSV หรือมีเพียงหัวตาราง");
const columns=getColumnMap(data[0]);
const required=[{name:"ชื่อ พขร",aliases:HEADERS.driver},{name:"Date",aliases:HEADERS.date},{name:"สาขา",aliases:HEADERS.branch}];
const missingHeaders=required.filter(it=>!it.aliases.some(a=>columns.has(normalizeHeader(a)))).map(it=>it.name);
if(missingHeaders.includes("ชื่อ พขร"))throw new Error("ไม่พบหัวคอลัมน์ชื่อ พขร กรุณาตรวจสอบชื่อหัวตาราง");
const stats={missingDriver:0,missingTimes:0,incompletePairs:0,invalidDates:0},nr=[];
data.slice(1).forEach((row,i)=>nr.push(...buildRecords(row,columns,i+2,stats)));
records=nr;records.sort((a,b)=>a.driver.localeCompare(b.driver,"th")||a.start-b.start);
restRows=[];
for(let i=0;i<records.length-1;i++){const c=records[i],n=records[i+1];if(c.driver!==n.driver)continue;
const ms=n.start.getTime()-c.end.getTime();if(ms<0)continue;
restRows.push({driver:c.driver,branch:n.branch||c.branch,previousEnd:c.end,nextStart:n.start,ms,status:ms>=REST_LIMIT_MS?"ผ่าน":"ไม่ผ่าน"})}
updateBranches();render();
const skipped=stats.missingDriver+stats.missingTimes+stats.invalidDates;
message.textContent="โหลดข้อมูลสำเร็จ: "+records.length+" รายการงาน | "+restRows.length+" รอบพัก | ข้ามแถว "+skipped+" แถว | ไม่มีชื่อ "+stats.missingDriver+" | ไม่มีคู่เวลา "+stats.missingTimes+" | วันที่/เวลาไม่ถูกต้อง "+stats.invalidDates+" | คู่เวลาไม่ครบ "+stats.incompletePairs;
if(missingHeaders.length)message.textContent+=" | ไม่พบหัวคอลัมน์บางรายการ: "+missingHeaders.join(", ");
}catch(error){console.error("Dashboard error:",error);message.textContent="เกิดข้อผิดพลาด: "+error.message}
finally{loading=false;reload.disabled=false}}
function duration(ms){const mins=Math.floor(ms/60000);return Math.floor(mins/60)+" ชม. "+(mins%60)+" นาที"}
const dateText=d=>d.toLocaleString("th-TH",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
function updateBranches(){const sel=document.getElementById("branch"),old=sel.value;
const bs=[...new Set(restRows.map(r=>r.branch).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"th"));
sel.innerHTML="";const all=document.createElement("option");all.value="all";all.textContent="ทุกสาขา";sel.appendChild(all);
bs.forEach(b=>{const o=document.createElement("option");o.value=b;o.textContent=b;sel.appendChild(o)});
sel.value=bs.includes(old)?old:"all"}
function render(){const search=document.getElementById("search").value.trim().toLowerCase(),
status=document.getElementById("status").value,branch=document.getElementById("branch").value;
const drivers=new Set(records.map(r=>r.driver)),passed=restRows.filter(r=>r.status==="ผ่าน").length,failed=restRows.filter(r=>r.status==="ไม่ผ่าน").length;
document.getElementById("drivers").textContent=drivers.size;document.getElementById("passed").textContent=passed;document.getElementById("failed").textContent=failed;
document.getElementById("rate").textContent=(restRows.length?Math.round(passed/restRows.length*100):0)+"%";
const filtered=restRows.filter(r=>r.driver.toLowerCase().includes(search)&&(status==="all"||r.status===status)&&(branch==="all"||r.branch===branch));
const tbody=document.getElementById("rows");tbody.innerHTML="";
if(!filtered.length){const tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=6;td.textContent="ไม่พบข้อมูลที่ตรงกับเงื่อนไข";tr.appendChild(td);tbody.appendChild(tr);return}
filtered.forEach(r=>{const tr=document.createElement("tr");
[r.driver,r.branch||"-",dateText(r.previousEnd),dateText(r.nextStart),duration(r.ms),r.status].forEach((v,i)=>{const td=document.createElement("td");td.textContent=v;if(i===5)td.className=r.status==="ผ่าน"?"pass":"fail";tr.appendChild(td)});
tbody.appendChild(tr)})}
document.getElementById("reload").addEventListener("click",loadData);
document.getElementById("search").addEventListener("input",render);
document.getElementById("status").addEventListener("change",render);
document.getElementById("branch").addEventListener("change",render);
loadData();
</script></body></html>
