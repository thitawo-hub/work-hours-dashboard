<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Rest Hours Dashboard</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:20px;color:#1f2937}
main{max-width:1200px;margin:auto}
h1{font-size:26px}
.note{color:#64748b}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0}
.card,section{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 8px #0000000d}
.num{font-size:28px;font-weight:bold;margin-top:8px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
input,select,button{padding:10px;border:1px solid #cbd5e1;border-radius:7px;background:white}
button{cursor:pointer}
.tablewrap{overflow-x:auto;background:white;border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:750px}
th,td{text-align:left;padding:11px;border-bottom:1px solid #e5e7eb}
th{background:#edf2f7}
.pass{color:#15803d;font-weight:bold}
.fail{color:#dc2626;font-weight:bold}
footer{margin-top:20px;font-size:13px;color:#64748b}
</style>
</head>
<body>
<main>
<h1>Driver Rest Hours Dashboard</h1>
<p class="note">ตรวจสอบเวลาพักระหว่างงาน — ต้องพักอย่างน้อย 10 ชั่วโมง</p>
<p id="message">กำลังโหลดข้อมูลจาก Google Sheets...</p>
<button id="reload">รีเฟรชข้อมูล</button>

<div class="cards">
  <div class="card">พขร.ทั้งหมด<div class="num" id="drivers">0</div></div>
  <div class="card">รอบพักผ่าน (≥10 ชม.)<div class="num" id="passed">0</div></div>
  <div class="card">รอบพักไม่ผ่าน (&lt;10 ชม.)<div class="num" id="failed">0</div></div>
  <div class="card">อัตราผ่าน<div class="num" id="rate">0%</div></div>
</div>

<section>
<div class="controls">
<input id="search" placeholder="ค้นหาชื่อ พขร.">
<select id="status">
<option value="all">ทุกสถานะ</option>
<option value="ผ่าน">ผ่าน</option>
<option value="ไม่ผ่าน">ไม่ผ่าน</option>
</select>
<select id="branch">
<option value="all">ทุกสาขา</option>
</select>
</div>
<div class="tablewrap">
<table>
<thead><tr>
<th>พขร.</th><th>สาขา</th><th>จบงานก่อนหน้า</th>
<th>เริ่มงานถัดไป</th><th>เวลาพัก</th><th>สถานะ</th>
</tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</section>
<footer>ข้อมูลโหลดจาก Google Sheets ที่เผยแพร่เป็น CSV</footer>
</main>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSWLQuTDK81qBHrVGIrbfLMQd2SbGcmeVPqgnd5RNzIKEYFYgenm6kofz8bzaLI-wmSnY6oZE8759Vy/pub?output=csv";

let records = [];
let restRows = [];

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (c === '"' && quoted && next === '"') { cell += '"'; i++; }
    else if (c === '"') quoted = !quoted;
    else if (c === ',' && !quoted) { row.push(cell); cell = ""; }
    else if ((c === '\n' || c === '\r') && !quoted) {
      if (c === '\r' && next === '\n') i++;
      row.push(cell);
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = []; cell = "";
    } else cell += c;
  }
  row.push(cell);
  if (row.some(v => v.trim() !== "")) rows.push(row);
  return rows;
}

function parseDate(value) {
  if (!value) return null;
  let s = String(value).trim().replace(/^"|"$/g, "");
  // รูปแบบวันที่และเวลาที่พบบ่อยใน Google Sheets
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if (m) {
    let a = +m[1], b = +m[2], year = +m[3];
    // รองรับปี พ.ศ.
    if (year > 2400) year -= 543;
    // ถ้าส่วนแรกเกิน 12 ถือว่าเป็นวัน/เดือน/ปี
    let day, month;
    if (a > 12) { day = a; month = b; }
    else if (b > 12) { month = a; day = b; }
    else { day = a; month = b; }
    return new Date(year, month - 1, day, +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
  }
  // รูปแบบ YYYY-MM-DD หรือ ISO
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) {
    let year = +m[1]; if (year > 2400) year -= 543;
    return new Date(year, +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
  }
  const d = new Date(s);
  return Number.isNaN(d.getTime()) ? null : d;
}

function loadData() {
  const url = CSV_URL + "&_=" + Date.now();
  document.getElementById("message").textContent = "กำลังโหลดข้อมูล...";
  fetch(url)
    .then(r => {
      if (!r.ok) throw new Error("โหลดข้อมูลไม่สำเร็จ");
      return r.text();
    })
    .then(text => {
      const data = parseCSV(text);
      if (data.length < 2) throw new Error("ไม่พบข้อมูลใน CSV");
      records = data.slice(1).map((r, index) => ({
        driver: (r[4] || "").trim(),
        startRaw: (r[13] || "").trim(),
        endRaw: (r[14] || "").trim(),
        branch: (r[17] || "").trim(),
        index
      })).filter(r => r.driver && r.startRaw && r.endRaw)
        .map(r => ({...r, start: parseDate(r.startRaw), end: parseDate(r.endRaw)}))
        .filter(r => r.start && r.end && r.end >= r.start);

      records.sort((a,b) => a.driver.localeCompare(b.driver, "th") || a.start - b.start);
      restRows = [];
      for (let i = 0; i < records.length - 1; i++) {
        const current = records[i], next = records[i+1];
        if (current.driver !== next.driver) continue;
        const ms = next.start - current.end;
        if (ms < 0) continue;
        restRows.push({
          driver: current.driver,
          branch: next.branch || current.branch,
          previousEnd: current.end,
          nextStart: next.start,
          ms,
          status: ms >= 10*60*60*1000 ? "ผ่าน" : "ไม่ผ่าน"
        });
      }
      updateBranches();
      render();
      document.getElementById("message").textContent =
        `โหลดสำเร็จ ${records.length} รายการงาน · ${new Date().toLocaleTimeString("th-TH")}`;
    })
    .catch(err => {
      document.getElementById("message").textContent =
        "โหลดข้อมูลไม่สำเร็จ กรุณาตรวจสอบว่า Google Sheets เผยแพร่เป็น CSV แล้ว และลิงก์เปิดได้โดยไม่ต้องลงชื่อเข้าใช้";
      console.error(err);
    });
}

function duration(ms) {
  const mins = Math.floor(ms / 60000);
  return Math.floor(mins / 60) + " ชม. " + (mins % 60) + " นาที";
}
function dateText(d) {
  return d.toLocaleString("th-TH", {
    year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", hour12:false
  });
}
function updateBranches() {
  const select = document.getElementById("branch");
  const old = select.value;
  const branches = [...new Set(restRows.map(r => r.branch).filter(Boolean))].sort();
  select.innerHTML = '<option value="all">ทุกสาขา</option>';
  branches.forEach(b => {
    const opt = document.createElement("option");
    opt.value = b; opt.textContent = b; select.appendChild(opt);
  });
  select.value = branches.includes(old) ? old : "all";
}
function render() {
  const search = document.getElementById("search").value.trim().toLowerCase();
  const status = document.getElementById("status").value;
  const branch = document.getElementById("branch").value;
  const drivers = new Set(records.map(r => r.driver));
  document.getElementById("drivers").textContent = drivers.size;
  document.getElementById("passed").textContent = restRows.filter(r => r.status === "ผ่าน").length;
  document.getElementById("failed").textContent = restRows.filter(r => r.status === "ไม่ผ่าน").length;
  const total = restRows.length;
  document.getElementById("rate").textContent =
    (total ? Math.round(restRows.filter(r => r.status === "ผ่าน").length / total * 100) : 0) + "%";

  const filtered = restRows.filter(r =>
    r.driver.toLowerCase().includes(search) &&
    (status === "all" || r.status === status) &&
    (branch === "all" || r.branch === branch)
  );
  document.getElementById("rows").innerHTML = filtered.map(r => `
    <tr>
      <td>${escapeHTML(r.driver)}</td>
      <td>${escapeHTML(r.branch || "-")}</td>
      <td>${dateText(r.previousEnd)}</td>
      <td>${dateText(r.nextStart)}</td>
      <td>${duration(r.ms)}</td>
      <td class="${r.status === "ผ่าน" ? "pass" : "fail"}">${r.status}</td>
    </tr>`).join("") || '<tr><td colspan="6">ไม่พบข้อมูลที่ตรงกับเงื่อนไข</td></tr>';
}
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}
document.getElementById("reload").addEventListener("click", loadData);
document.getElementById("search").addEventListener("input", render);
document.getElementById("status").addEventListener("change", render);
document.getElementById("branch").addEventListener("change", render);
loadData();
</script>
</body>
</html>
